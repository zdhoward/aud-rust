name: Bug report
description: Report incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command or code to reproduce
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aud version (`aud --version`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version (first line of `ffmpeg -version`)
  - type: dropdown
    id: python
    attributes:
      label: Does the Python original (zdhoward/aud) behave differently?
      options: ["Not checked", "Same behavior", "Different behavior"]
