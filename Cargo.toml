[workspace]
resolver = "3"
members = ["crates/aud-core", "crates/aud-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/zdhoward/aud-rust"
authors = ["Zach Howard"]

[workspace.dependencies]
aud-core = { path = "crates/aud-core", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
